{{- if not ($.Page.Scratch.Get "embed-pdf-count") -}}

<script type="text/javascript" src= '/js/pdf-js/build/pdf.js'></script>

<style>
  .embed-pdf-container {
    position: relative;
    max-width: 680px;
    width: 100%;
    height: auto;
    min-height: 20vh;
    margin: 0 auto;
    /* overflow-y:scroll; */
  }

  .pdf-canvas {
    border: none;
    border-radius: 8px;
    box-shadow: 0 12px 36px rgba(26, 56, 69, 0.16);
    direction: ltr;
    width: 100%;
    height: auto;
    display: none;
  }

  .pdf-loadingWrapper {
    display: none;
    justify-content: center;
    align-items: center;
    width: 100%;
    height: 350px;
  }

  .pdf-loading {
    display: inline-block;
    width: 44px;
    height: 44px;
    border: 3px solid rgba(44, 95, 111, 0.15);
    border-radius: 50%;
    border-top-color: #2c5f6f;
    animation: spin 1s ease-in-out infinite;
    -webkit-animation: spin 1s ease-in-out infinite;
  }

  /* Toolbar: page navigation + single download action, above the page */
  .pdf-toolbar {
    display: none;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    flex-wrap: wrap;
    max-width: 680px;
    margin: 0 auto 14px auto;
  }

  .pdf-nav-group {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .pdf-nav-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 38px;
    height: 38px;
    padding: 0;
    border-radius: 50%;
    border: 1px solid rgba(44, 95, 111, 0.25);
    background: #fff;
    color: #2c5f6f;
    font-size: 0.85rem;
    cursor: pointer;
    transition: background-color 0.2s ease, color 0.2s ease, box-shadow 0.2s ease;
  }

  .pdf-nav-btn:hover {
    background: #2c5f6f;
    color: #fff;
    box-shadow: 0 6px 16px rgba(26, 56, 69, 0.2);
  }

  .pdf-nav-btn:focus {
    outline: none;
    box-shadow: 0 0 0 3px rgba(126, 208, 224, 0.45);
  }

  .pdf-nav-btn svg {
    height: 1.1em;
    width: 1.1em;
  }

  .pdf-pagecounter {
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 0.5px;
    color: rgba(0, 0, 0, 0.6);
    padding: 8px 16px;
    border-radius: 20px;
    background: rgba(44, 95, 111, 0.06);
  }

  .pdf-pagesep {
    margin: 0 4px;
    opacity: 0.5;
  }

  .pdf-download-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    width: 38px;
    height: 38px;
    color: #2c5f6f;
    background-color: #fff;
    border: 1px solid rgba(44, 95, 111, 0.25);
    border-radius: 50%;
    box-shadow: 0 6px 18px rgba(26, 56, 69, 0.14);
    text-decoration: none;
    transition: background-color 0.2s ease, color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
  }

  .pdf-download-btn:hover {
    background-color: #2c5f6f;
    color: #fff;
    transform: translateY(-2px);
    box-shadow: 0 10px 24px rgba(26, 56, 69, 0.22);
  }

  .pdf-download-btn svg {
    height: 1.1em;
    width: 1.1em;
  }

  .pdf-annotation-layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
  }

  .pdf-annotation-link {
    position: absolute;
    display: block;
    border-radius: 3px;
    transition: background-color 0.15s ease;
  }

  .pdf-annotation-link:hover,
  .pdf-annotation-link:focus {
    background-color: rgba(126, 208, 224, 0.28);
    outline: none;
  }

  @keyframes spin {
    to { -webkit-transform: rotate(360deg); }
  }
  @-webkit-keyframes spin {
    to { -webkit-transform: rotate(360deg); }
  }
  </style>
{{- end -}}

{{- $.Page.Scratch.Add "embed-pdf-count" 1 -}}
<div class="pdf-toolbar" id="pdf-paginator-{{ substr (.Get "url" | md5) 0 8 }}">
    <div class="pdf-nav-group">
      <button class="pdf-nav-btn" id="pdf-prev-{{ substr (.Get "url" | md5) 0 8 }}" aria-label="Previous page">
        <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <span class="pdf-pagecounter">
        <span class="pdf-pagenum" id="pdf-pagenum-{{ substr (.Get "url" | md5) 0 8 }}"></span><span class="pdf-pagesep">/</span><span class="pdf-pagecount" id="pdf-pagecount-{{ substr (.Get "url" | md5) 0 8 }}"></span>
      </span>
      <button class="pdf-nav-btn" id="pdf-next-{{ substr (.Get "url" | md5) 0 8 }}" aria-label="Next page">
        <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <a class="pdf-download-btn" id="pdf-source-{{ substr (.Get "url" | md5) 0 8 }}" href="{{ .Get "url" }}" aria-label="Download PDF" download>
      <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 18 18">
          <path d="M9 13c.3 0 .5-.1.7-.3L15.4 7 14 5.6l-4 4V1H8v8.6l-4-4L2.6 7l5.7 5.7c.2.2.4.3.7.3zm-7 2h14v2H2z" />
      </svg>
    </a>
</div>

<div class="embed-pdf-container" id="embed-pdf-container-{{ substr (.Get "url" | md5) 0 8 }}">
    <div class="pdf-loadingWrapper" id="pdf-loadingWrapper-{{ substr (.Get "url" | md5) 0 8 }}">
        <div class="pdf-loading" id="pdf-loading-{{ substr (.Get "url" | md5) 0 8 }}"></div>
    </div>
    <canvas class="pdf-canvas" id="pdf-canvas-{{ substr (.Get "url" | md5) 0 8 }}"></canvas>
    <div class="pdf-annotation-layer" id="pdf-annotation-layer-{{ substr (.Get "url" | md5) 0 8 }}"></div>
</div>

<noscript>
View the PDF file <a class="pdf-download-btn" id="pdf-source-noscript-{{ substr (.Get "url" | md5) 0 8 }}" href="{{ .Get "url" }}">here</a>.
</noscript>

<script type="text/javascript">
    (function(){
    var url = '{{ .Get "url" }}';

    var hidePaginator = "{{ .Get "hidePaginator" }}" === "true";
    var hideLoader = "{{ .Get "hideLoader" }}" === "true";
    var selectedPageNum = parseInt("{{ .Get "renderPageNum" }}") || 1;

    // Loaded via <script> tag, create shortcut to access PDF.js exports.
    var pdfjsLib = window['pdfjs-dist/build/pdf'];

    // The workerSrc property shall be specified.
    if (pdfjsLib.GlobalWorkerOptions.workerSrc == '')
      pdfjsLib.GlobalWorkerOptions.workerSrc = "{{.Site.BaseURL}}" + 'js/pdf-js/build/pdf.worker.js';

    // Change the Scale value for lower or higher resolution.
    var pdfDoc = null,
        pageNum = selectedPageNum,
        pageRendering = false,
        pageNumPending = null,
        scale = 3,
        canvas = document.getElementById('pdf-canvas-{{ substr (.Get "url" | md5) 0 8 }}'),
        ctx = canvas.getContext('2d'),
        annotationLayer = document.getElementById('pdf-annotation-layer-{{ substr (.Get "url" | md5) 0 8 }}'),
        paginator = document.getElementById("pdf-paginator-{{ substr (.Get "url" | md5) 0 8 }}"),
        loadingWrapper = document.getElementById('pdf-loadingWrapper-{{ substr (.Get "url" | md5) 0 8 }}');


    // Attempt to show paginator and loader if enabled
    showPaginator();
    showLoader();

    /**
     * Get page info from document, resize canvas accordingly, and render page.
     * @param num Page number.
     */
    function renderPage(num) {
      pageRendering = true;
      clearAnnotations();
      // Using promise to fetch the page
      pdfDoc.getPage(num).then(function(page) {
        var viewport = page.getViewport({scale: scale});
        canvas.height = viewport.height;
        canvas.width = viewport.width;

        // Render PDF page into canvas context
        var renderContext = {
          canvasContext: ctx,
          viewport: viewport
        };
        var renderTask = page.render(renderContext);

        renderLinkAnnotations(page, viewport);

        // Wait for rendering to finish
        renderTask.promise.then(function() {
          pageRendering = false;
          showContent();

          if (pageNumPending !== null) {
            // New page rendering is pending
            renderPage(pageNumPending);
            pageNumPending = null;
          }
        });
      });

      // Update page counters
      document.getElementById('pdf-pagenum-{{ substr (.Get "url" | md5) 0 8 }}').textContent = num;
    }

    /**
     * Removes any link overlays from a previous page render.
     */
    function clearAnnotations() {
      if (!annotationLayer) return;
      while (annotationLayer.firstChild) {
        annotationLayer.removeChild(annotationLayer.firstChild);
      }
    }

    /**
     * Overlays clickable areas for the page's link annotations (e.g. DOI,
     * email, website links) on top of the rendered canvas, since the canvas
     * itself is just a flat image and carries no link information.
     */
    function renderLinkAnnotations(page, viewport) {
      if (!annotationLayer) return;
      page.getAnnotations().then(function(annotations) {
        // A pending/queued page change may have started a newer render already.
        if (pageNumPending !== null) return;
        clearAnnotations();
        annotations.forEach(function(annotation) {
          if (annotation.subtype !== 'Link' || !annotation.url) return;
          var vpRect = viewport.convertToViewportRectangle(annotation.rect);
          var left = Math.min(vpRect[0], vpRect[2]);
          var top = Math.min(vpRect[1], vpRect[3]);
          var width = Math.abs(vpRect[2] - vpRect[0]);
          var height = Math.abs(vpRect[3] - vpRect[1]);

          var link = document.createElement('a');
          link.href = annotation.url;
          link.target = '_blank';
          link.rel = 'noopener noreferrer';
          link.className = 'pdf-annotation-link';
          link.style.left = (left / viewport.width * 100) + '%';
          link.style.top = (top / viewport.height * 100) + '%';
          link.style.width = (width / viewport.width * 100) + '%';
          link.style.height = (height / viewport.height * 100) + '%';
          annotationLayer.appendChild(link);
        });
      });
    }

    /**
     * Hides loader and shows canvas
     */
    function showContent() {
      loadingWrapper.style.display = 'none';
      canvas.style.display = 'block';
    }

    /**
     * If we haven't disabled the loader, show loader and hide canvas
     */
    function showLoader() {
      if(hideLoader) return
      loadingWrapper.style.display = 'flex';
      canvas.style.display = 'none';
    }

    /**
     * If we haven't disabled the paginator, show paginator
     */
    function showPaginator() {
      if(hidePaginator) return
      paginator.style.display = 'flex';
    }

    /**
     * If another page rendering in progress, waits until the rendering is
     * finished. Otherwise, executes rendering immediately.
     */
    function queueRenderPage(num) {
      if (pageRendering) {
        pageNumPending = num;
      } else {
        renderPage(num);
      }
    }

    /**
     * Displays previous page.
     */
    function onPrevPage() {
      if (pageNum <= 1) {
        return;
      }
      pageNum--;
      queueRenderPage(pageNum);
    }
    document.getElementById('pdf-prev-{{ substr (.Get "url" | md5) 0 8 }}').addEventListener('click', onPrevPage);

    /**
     * Displays next page.
     */
    function onNextPage() {
      if (pageNum >= pdfDoc.numPages) {
        return;
      }
      pageNum++;
      queueRenderPage(pageNum);
    }
    document.getElementById('pdf-next-{{ substr (.Get "url" | md5) 0 8 }}').addEventListener('click', onNextPage);

    /**
     * Asynchronously downloads PDF.
     */
    pdfjsLib.getDocument(url).promise.then(function(pdfDoc_) {
      pdfDoc = pdfDoc_;
      var numPages = pdfDoc.numPages;
      document.getElementById('pdf-pagecount-{{ substr (.Get "url" | md5) 0 8 }}').textContent = numPages;

      // If the user passed in a number that is out of range, render the last page.
      if(pageNum > numPages) {
        pageNum = numPages
      }

      // Initial/first page rendering
      renderPage(pageNum);
    });
    })();
</script>
